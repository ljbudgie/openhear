name: Bench — awareness classifier (ESC-50)

# Classifier-only bench test. Downloads the YAMNet model and the ESC-50
# recordings at run time; neither is committed to this repository.
# See scripts/bench_awareness.py and docs/BENCH_RESULTS.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-awareness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: ESC-50 hit rate and false alerts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_URL: https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite
      MODEL_URL_FALLBACK: https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/audio_classification/android/lite-model_yamnet_classification_tflite_1.tflite
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy ai-edge-litert soundfile

      - name: Download YAMNet model
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          if curl -fsSL "$MODEL_URL" -o "$RUNNER_TEMP/model/yamnet.tflite"; then
            echo "MODEL_SOURCE=$MODEL_URL" >> "$GITHUB_ENV"
          else
            curl -fsSL "$MODEL_URL_FALLBACK" -o "$RUNNER_TEMP/model/yamnet.tflite"
            echo "MODEL_SOURCE=$MODEL_URL_FALLBACK" >> "$GITHUB_ENV"
          fi
          sha256sum "$RUNNER_TEMP/model/yamnet.tflite"
          ls -l "$RUNNER_TEMP/model/yamnet.tflite"

      - name: Download ESC-50
        run: |
          git clone --depth 1 https://github.com/karolpiczak/ESC-50 "$RUNNER_TEMP/ESC-50"
          git -C "$RUNNER_TEMP/ESC-50" rev-parse HEAD
          ls "$RUNNER_TEMP/ESC-50/audio" | wc -l

      - name: Run bench
        run: |
          python -m scripts.bench_awareness \
            --esc50 "$RUNNER_TEMP/ESC-50" \
            --model "$RUNNER_TEMP/model/yamnet.tflite" \
            --model-source "$MODEL_SOURCE" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out awareness_bench_report.json \
            --markdown awareness_bench_report.md > /dev/null
          cat awareness_bench_report.md >> "$GITHUB_STEP_SUMMARY"
          cat awareness_bench_report.md
          echo "-----BEGIN REPORT JSON-----"
          python -c "import json;print(json.dumps(json.load(open('awareness_bench_report.json')),sort_keys=True,separators=(',',':')))"
          echo "-----END REPORT JSON-----"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: awareness-bench-report
          path: |
            awareness_bench_report.json
            awareness_bench_report.md
