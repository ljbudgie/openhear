name: Bench — awareness classifier

# Classifier-only bench tests on recorded clips. The YAMNet model and every
# dataset are downloaded at run time; no audio and no model file is committed.
# See scripts/bench_awareness.py and docs/BENCH_RESULTS.md.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Which dataset to run
        type: choice
        default: esc50
        options: [esc50, fsd50k, sonyc, all]
      mode:
        description: Run the model, re-analyse stored scores under all candidate rules, or score rule V3 alone on stored scores
        type: choice
        default: run-model
        options: [run-model, reanalyse-stored-scores, score-v3-on-stored-scores]
      scores_run_esc50:
        description: Run whose stored ESC-50 scores to re-analyse
        default: "42899256052"
      scores_run_fsd50k:
        description: Run whose stored FSD50K scores to re-analyse
        default: "42911082407"
      scores_run_sonyc:
        description: Run whose stored SONYC-UST scores to re-analyse
        default: "42899256052"

permissions:
  contents: read
  actions: read

concurrency:
  group: bench-awareness-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_URL: https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  esc50:
    name: ESC-50 (before/after comparison)
    if: (inputs.mode == 'run-model' || inputs.mode == '') && (inputs.dataset == 'esc50' || inputs.dataset == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy ai-edge-litert soundfile
      - name: Download YAMNet model
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          curl -fsSL --retry 5 "$MODEL_URL" -o "$RUNNER_TEMP/model/yamnet.tflite"
          sha256sum "$RUNNER_TEMP/model/yamnet.tflite"
      - name: Download ESC-50
        run: |
          git clone --depth 1 https://github.com/karolpiczak/ESC-50 "$RUNNER_TEMP/ESC-50"
          echo "DATASET_VERSION=commit $(git -C "$RUNNER_TEMP/ESC-50" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run bench
        run: |
          python -m scripts.bench_awareness --dataset esc50 \
            --data "$RUNNER_TEMP/ESC-50" \
            --model "$RUNNER_TEMP/model/yamnet.tflite" --model-source "$MODEL_URL" \
            --dataset-version "$DATASET_VERSION" --run-url "$RUN_URL" \
            --out bench_esc50.json --markdown bench_esc50.md \
            --scores-out bench_esc50_scores.npz > /dev/null
      - name: Print report
        run: |
          cat bench_esc50.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-----BEGIN REPORT JSON-----"
          python -c "import json;print(json.dumps(json.load(open('bench_esc50.json')),sort_keys=True,separators=(',',':')))"
          echo "-----END REPORT JSON-----"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-esc50
          path: bench_esc50*

  fsd50k:
    name: FSD50K eval (CC0 and CC BY clips only)
    if: (inputs.mode == 'run-model' || inputs.mode == '') && (inputs.dataset == 'fsd50k' || inputs.dataset == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ZENODO: https://zenodo.org/records/4060432/files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy ai-edge-litert soundfile
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
      - name: Download YAMNet model
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          curl -fsSL --retry 5 "$MODEL_URL" -o "$RUNNER_TEMP/model/yamnet.tflite"
          sha256sum "$RUNNER_TEMP/model/yamnet.tflite"
      - name: Download FSD50K eval
        run: |
          mkdir -p "$RUNNER_TEMP/fsd50k" && cd "$RUNNER_TEMP/fsd50k"
          for f in FSD50K.ground_truth.zip FSD50K.metadata.zip FSD50K.eval_audio.z01 FSD50K.eval_audio.zip; do
            curl -fL --retry 8 --retry-delay 15 -C - -sS -o "$f" "$ZENODO/$f?download=1"
            ls -l "$f"
          done
          unzip -q FSD50K.ground_truth.zip && unzip -q FSD50K.metadata.zip
          zip -q -s 0 FSD50K.eval_audio.zip --out eval_unsplit.zip
          rm -f FSD50K.eval_audio.z01 FSD50K.eval_audio.zip
          ls -l && df -h .
          echo "--- vocabulary.csv ---" && cat FSD50K.ground_truth/vocabulary.csv | tr '\n' ' '
      - name: Run bench
        run: |
          python -m scripts.bench_awareness --dataset fsd50k \
            --data "$RUNNER_TEMP/fsd50k" --audio-zip "$RUNNER_TEMP/fsd50k/eval_unsplit.zip" \
            --model "$RUNNER_TEMP/model/yamnet.tflite" --model-source "$MODEL_URL" \
            --dataset-version "Zenodo record 4060432, version 1.0" --run-url "$RUN_URL" \
            --out bench_fsd50k.json --markdown bench_fsd50k.md \
            --scores-out bench_fsd50k_scores.npz > /dev/null
      - name: Print report
        run: |
          cat bench_fsd50k.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-----BEGIN REPORT JSON-----"
          python -c "import json;print(json.dumps(json.load(open('bench_fsd50k.json')),sort_keys=True,separators=(',',':')))"
          echo "-----END REPORT JSON-----"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-fsd50k
          path: bench_fsd50k*

  sonyc:
    name: SONYC-UST v2.3.0 (verified street recordings)
    if: (inputs.mode == 'run-model' || inputs.mode == '') && (inputs.dataset == 'sonyc' || inputs.dataset == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ZENODO: https://zenodo.org/records/3966543/files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy ai-edge-litert soundfile
      - name: Download YAMNet model
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          curl -fsSL --retry 5 "$MODEL_URL" -o "$RUNNER_TEMP/model/yamnet.tflite"
          sha256sum "$RUNNER_TEMP/model/yamnet.tflite"
      - name: Download SONYC-UST annotations
        run: |
          mkdir -p "$RUNNER_TEMP/sonyc" && cd "$RUNNER_TEMP/sonyc"
          curl -fL --retry 8 --retry-delay 15 -sS -o annotations.csv "$ZENODO/annotations.csv?download=1"
          curl -fL --retry 8 --retry-delay 15 -sS -o README.md "$ZENODO/README.md?download=1"
          echo "--- README ---" && cat README.md
          echo "--- header ---" && head -1 annotations.csv
          cd "$GITHUB_WORKSPACE" && python -m scripts.bench_datasets sonyc-summary --data "$RUNNER_TEMP/sonyc"
      - name: Download SONYC-UST audio, keeping only the clips used
        run: |
          cd "$RUNNER_TEMP/sonyc"
          for i in $(seq 0 18); do
            curl -fL --retry 8 --retry-delay 15 -C - -sS -o "audio-$i.tar.gz" "$ZENODO/audio-$i.tar.gz?download=1"
            mkdir -p "unpack-$i" && tar -xzf "audio-$i.tar.gz" -C "unpack-$i" && rm -f "audio-$i.tar.gz"
            (cd "$GITHUB_WORKSPACE" && python -m scripts.bench_datasets sonyc-keep --data "$RUNNER_TEMP/sonyc" \
              --source "$RUNNER_TEMP/sonyc/unpack-$i" --audio-dir "$RUNNER_TEMP/sonyc/audio")
            rm -rf "unpack-$i"
          done
          ls audio | wc -l && df -h .
      - name: Run bench
        run: |
          python -m scripts.bench_awareness --dataset sonyc \
            --data "$RUNNER_TEMP/sonyc" --audio-dir "$RUNNER_TEMP/sonyc/audio" \
            --model "$RUNNER_TEMP/model/yamnet.tflite" --model-source "$MODEL_URL" \
            --dataset-version "Zenodo record 3966543, version 2.3.0" --run-url "$RUN_URL" \
            --out bench_sonyc.json --markdown bench_sonyc.md \
            --scores-out bench_sonyc_scores.npz > /dev/null
      - name: Print report
        run: |
          cat bench_sonyc.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-----BEGIN REPORT JSON-----"
          python -c "import json;print(json.dumps(json.load(open('bench_sonyc.json')),sort_keys=True,separators=(',',':')))"
          echo "-----END REPORT JSON-----"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-sonyc
          path: bench_sonyc*

  # ---------------------------------------------------------------------------
  # Re-analysis of stored scores under the candidate rules. The model is not run.
  # Rules and pass conditions: docs/BENCH_PLAN_v1.9.md
  # ---------------------------------------------------------------------------

  rules:
    name: Rules on stored scores (${{ matrix.dataset }})
    if: inputs.mode == 'reanalyse-stored-scores'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: [esc50, fsd50k, sonyc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy
      - name: Pick the run that holds the stored scores
        run: |
          case "${{ matrix.dataset }}" in
            esc50) echo "SCORES_RUN=${{ inputs.scores_run_esc50 }}" >> "$GITHUB_ENV" ;;
            fsd50k) echo "SCORES_RUN=${{ inputs.scores_run_fsd50k }}" >> "$GITHUB_ENV" ;;
            sonyc) echo "SCORES_RUN=${{ inputs.scores_run_sonyc }}" >> "$GITHUB_ENV" ;;
          esac
      - name: Download stored scores
        uses: actions/download-artifact@v4
        with:
          name: bench-${{ matrix.dataset }}
          run-id: ${{ env.SCORES_RUN }}
          github-token: ${{ github.token }}
          path: stored
      - name: Download dataset metadata (no audio)
        run: |
          mkdir -p "$RUNNER_TEMP/meta" && cd "$RUNNER_TEMP/meta"
          case "${{ matrix.dataset }}" in
            esc50)
              commit=$(python -c "import json;print(json.load(open('$GITHUB_WORKSPACE/docs/bench/awareness_bench_v1.8.0_esc50.json'))['provenance']['dataset_version'].split()[-1])")
              mkdir -p meta
              curl -fsSL --retry 5 -o meta/esc50.csv "https://raw.githubusercontent.com/karolpiczak/ESC-50/$commit/meta/esc50.csv"
              ;;
            fsd50k)
              for f in FSD50K.ground_truth.zip FSD50K.metadata.zip; do
                curl -fL --retry 8 --retry-delay 15 -sS -o "$f" "https://zenodo.org/records/4060432/files/$f?download=1"
                unzip -q "$f"
              done
              ;;
            sonyc)
              curl -fL --retry 8 --retry-delay 15 -sS -o annotations.csv "https://zenodo.org/records/3966543/files/annotations.csv?download=1"
              ;;
          esac
          ls
      - name: Apply the rules
        run: |
          ls -l stored
          python -m scripts.bench_rules analyse --dataset "${{ matrix.dataset }}" \
            --data "$RUNNER_TEMP/meta" \
            --scores "stored/bench_${{ matrix.dataset }}_scores.npz" \
            --scores-run "$SCORES_RUN" --run-url "$RUN_URL" \
            --out "rules_${{ matrix.dataset }}.json" --markdown "rules_${{ matrix.dataset }}.md"
      - name: Print report
        run: |
          cat "rules_${{ matrix.dataset }}.md" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-----BEGIN REPORT JSON-----"
          python -c "import json;print(json.dumps(json.load(open('rules_${{ matrix.dataset }}.json')),sort_keys=True,separators=(',',':')))"
          echo "-----END REPORT JSON-----"
      - uses: actions/upload-artifact@v4
        with:
          name: rules-${{ matrix.dataset }}
          path: rules_${{ matrix.dataset }}.*

  v3:
    name: Rule V3 on stored scores (${{ matrix.dataset }})
    if: inputs.mode == 'score-v3-on-stored-scores'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: [esc50, fsd50k, sonyc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy
      - name: Pick the run that holds the stored scores
        run: |
          case "${{ matrix.dataset }}" in
            esc50) echo "SCORES_RUN=${{ inputs.scores_run_esc50 }}" >> "$GITHUB_ENV" ;;
            fsd50k) echo "SCORES_RUN=${{ inputs.scores_run_fsd50k }}" >> "$GITHUB_ENV" ;;
            sonyc) echo "SCORES_RUN=${{ inputs.scores_run_sonyc }}" >> "$GITHUB_ENV" ;;
          esac
      - name: Download stored scores
        uses: actions/download-artifact@v4
        with:
          name: bench-${{ matrix.dataset }}
          run-id: ${{ env.SCORES_RUN }}
          github-token: ${{ github.token }}
          path: stored
      - name: Download dataset metadata (no audio)
        run: |
          mkdir -p "$RUNNER_TEMP/meta" && cd "$RUNNER_TEMP/meta"
          case "${{ matrix.dataset }}" in
            esc50)
              commit=$(python -c "import json;print(json.load(open('$GITHUB_WORKSPACE/docs/bench/awareness_bench_v1.8.0_esc50.json'))['provenance']['dataset_version'].split()[-1])")
              mkdir -p meta
              curl -fsSL --retry 5 -o meta/esc50.csv "https://raw.githubusercontent.com/karolpiczak/ESC-50/$commit/meta/esc50.csv"
              ;;
            fsd50k)
              for f in FSD50K.ground_truth.zip FSD50K.metadata.zip; do
                curl -fL --retry 8 --retry-delay 15 -sS -o "$f" "https://zenodo.org/records/4060432/files/$f?download=1"
                unzip -q "$f"
              done
              ;;
            sonyc)
              curl -fL --retry 8 --retry-delay 15 -sS -o annotations.csv "https://zenodo.org/records/3966543/files/annotations.csv?download=1"
              ;;
          esac
          ls
      - name: Score the current label map with rule V3 off and on
        run: |
          ls -l stored
          python -m scripts.bench_awareness --dataset "${{ matrix.dataset }}" \
            --data "$RUNNER_TEMP/meta" \
            --stored-scores "stored/bench_${{ matrix.dataset }}_scores.npz" \
            --scores-run "$SCORES_RUN" --voice-rule-v3 --run-url "$RUN_URL" \
            --out "v3_${{ matrix.dataset }}.json" --markdown "v3_${{ matrix.dataset }}.md" > /dev/null
      - name: Print report
        run: |
          cat "v3_${{ matrix.dataset }}.md" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-----BEGIN REPORT JSON-----"
          python -c "import json;print(json.dumps(json.load(open('v3_${{ matrix.dataset }}.json')),sort_keys=True,separators=(',',':')))"
          echo "-----END REPORT JSON-----"
      - uses: actions/upload-artifact@v4
        with:
          name: v3-${{ matrix.dataset }}
          path: v3_${{ matrix.dataset }}.*

  rules-verdict:
    name: Rules verdict (pass or fail per the plan)
    needs: rules
    if: inputs.mode == 'reanalyse-stored-scores'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: rules-*
          merge-multiple: true
          path: reports
      - name: Verdict
        run: |
          python -m scripts.bench_rules verdict --reports reports/rules_esc50.json \
            reports/rules_fsd50k.json reports/rules_sonyc.json \
            --out rules_verdict.json --markdown rules_verdict.md | tee -a "$GITHUB_STEP_SUMMARY"
          echo "-----BEGIN REPORT JSON-----"
          python -c "import json;print(json.dumps(json.load(open('rules_verdict.json')),sort_keys=True,separators=(',',':')))"
          echo "-----END REPORT JSON-----"
      - uses: actions/upload-artifact@v4
        with:
          name: rules-verdict
          path: rules_verdict.*
