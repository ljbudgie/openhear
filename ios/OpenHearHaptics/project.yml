# XcodeGen spec for OpenHear Haptics.
# Generate the Xcode project with:  xcodegen generate
# The generated OpenHearHaptics.xcodeproj is not committed (see .gitignore).
name: OpenHearHaptics
options:
  bundleIdPrefix: uk.co.theburgessprinciple.openhear
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  OpenHearHaptics:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenHearHaptics
    settings:
      base:
        PRODUCT_NAME: OpenHearHaptics
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.theburgessprinciple.openhear.haptics
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
  OpenHearHapticsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenHearHapticsTests
    dependencies:
      - target: OpenHearHaptics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.theburgessprinciple.openhear.haptics.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
schemes:
  OpenHearHaptics:
    build:
      targets:
        OpenHearHaptics: all
        OpenHearHapticsTests: [test]
    test:
      targets:
        - OpenHearHapticsTests
